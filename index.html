<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Pals — Pokemon Edition</title>
<style>
  html,body{height:100%;margin:0;background:radial-gradient(circle at 50% 0%,#1b2a1e,#0c130e 70%);
    color:#d7e8d2;font-family:ui-monospace,"Cascadia Code",Consolas,monospace;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    -webkit-user-select:none;user-select:none;overflow:hidden}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;border-radius:10px;
    box-shadow:0 14px 44px rgba(0,0,0,.6),0 0 0 3px #22331f;cursor:default}
  .hud{display:flex;gap:20px;font-size:13px;letter-spacing:.6px;opacity:.85}
  .hud b{color:#a9e08a;font-weight:600}
  .tip{font-size:12px;opacity:.45}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><span>pals <b id="n">0</b></span><span>mood <b id="mood">&mdash;</b></span></div>
<div class="tip">click a pokemon to pet it</div>
<script>
const W = 320, H = 180;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let scale = 1;

function resize(){
  const maxW = Math.min(window.innerWidth - 48, 1280);
  const maxH = window.innerHeight - 150;
  scale = Math.max(1, Math.floor(Math.min(maxW / W, maxH / H)));
  canvas.width = W * scale;
  canvas.height = H * scale;
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', resize);
resize();

/* ---------- real pokemon sprites ---------- */

// Straight from the PokeAPI sprites repo, loaded by URL so there's nothing to download.
const SPRITE_BASE = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/';
const ROSTER = [
  { id: 1,   name: 'Bulbasaur'  },
  { id: 4,   name: 'Charmander' },
  { id: 7,   name: 'Squirtle'   },
  { id: 25,  name: 'Pikachu'    },
  { id: 133, name: 'Eevee'      }
];

function spriteUrl(id){ return SPRITE_BASE + id + '.png'; }

// preload so nobody pops in mid-walk
const IMAGES = {};
for (const p of ROSTER){
  const img = new Image();
  const url = spriteUrl(p.id);
  img.crossOrigin = 'anonymous'; // lets us measure it on a canvas without tainting
  img.onload = () => { img.box = contentBox(img); };
  // if the host won't serve CORS, reload plainly — better a full-frame sprite than none
  img.onerror = () => { if (img.crossOrigin){ img.crossOrigin = null; img.src = url; } };
  img.src = url;
  IMAGES[p.id] = img;
}

// PokeAPI sprites are 96x96 with transparent padding around the pokemon, so the
// drawn bottom of the image is NOT its feet — that gap is what made them look
// like they were hovering. Measure the opaque pixels once, then stand the
// visible feet on the ground line.
function contentBox(img){
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0);
  try {
    const d = g.getImageData(0, 0, c.width, c.height).data;
    let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
    for (let y = 0; y < c.height; y++){
      for (let x = 0; x < c.width; x++){
        if (d[(y * c.width + x) * 4 + 3] > 8){
          if (x < x0) x0 = x;
          if (x > x1) x1 = x;
          if (y < y0) y0 = y;
          if (y > y1) y1 = y;
        }
      }
    }
    if (x1 >= x0) return { x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
  } catch (e) { /* cross-origin without CORS — fall back to the full frame */ }
  return { x: 0, y: 0, w: img.width, h: img.height };
}

/* ---------- emote icons ---------- */

const ICONS = {
  heart: {pal:{p:'#ff5b7f'}, rows:[
    '.pp.pp..','ppppppp.','ppppppp.','ppppppp.','.ppppp..','..ppp...','...p....','........']},
  note: {pal:{n:'#6bb8ff'}, rows:[
    '....nnn.','....nn.n','....nnn.','....nn..','..nnnn..','.nnnnn..','.nn..nn.','........']},
  zzz: {pal:{z:'#b9a7ff'}, rows:[
    '.zzzzz..','....zz..','...zz...','..zz....','.zz.....','.zzzzz..','........','........']},
  bang: {pal:{b:'#ffd166'}, rows:[
    '..bb....','..bb....','..bb....','..bb....','..bb....','........','..bb....','........']},
  sweat: {pal:{s:'#8fd8ff'}, rows:[
    '....ss..','...ssss.','...ssss.','....ss..','.....s..','........','........','........']},
  sparkle: {pal:{y:'#ffe066'}, rows:[
    '...y....','...y....','..yyy...','.yyyyy..','..yyy...','...y....','...y....','........']}
};

/* ---------- ground ---------- */

function makeGround(){
  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  const g = off.getContext('2d');
  g.fillStyle = '#5aa84a';
  g.fillRect(0, 0, W, H);
  for (let y = 0; y < H; y++){
    for (let x = 0; x < W; x++){
      const r = Math.random();
      if (r < 0.16)      g.fillStyle = 'rgba(255,255,255,0.05)';
      else if (r < 0.34) g.fillStyle = 'rgba(0,0,0,0.05)';
      else continue;
      g.fillRect(x, y, 1, 1);
    }
  }
  for (let i = 0; i < 240; i++){
    const x = Math.floor(Math.random() * W), y = Math.floor(Math.random() * H);
    g.fillStyle = 'rgba(32,92,42,0.6)';
    g.fillRect(x, y, 1, 3);
    g.fillRect(x + 1, y + 1, 1, 2);
    g.fillRect(x - 1, y + 1, 1, 2);
  }
  const fcols = ['#ff8fb1','#ffe066','#c9a7ff','#ffffff'];
  for (let i = 0; i < 26; i++){
    const x = Math.floor(Math.random() * W), y = Math.floor(Math.random() * H);
    g.fillStyle = fcols[Math.floor(Math.random() * fcols.length)];
    g.fillRect(x, y, 1, 1); g.fillRect(x + 2, y, 1, 1);
    g.fillRect(x + 1, y - 1, 1, 1); g.fillRect(x + 1, y + 1, 1, 1);
    g.fillStyle = '#ffe066';
    g.fillRect(x + 1, y, 1, 1);
  }
  return off;
}

const ground = makeGround();

/* ---------- pals ---------- */

class Pal {
  constructor(mon, x, y){
    this.mon = mon;
    this.img = IMAGES[mon.id];
    this.x = x; this.y = y;
    this.dir = Math.random() < 0.5 ? 1 : -1;
    this.target = null;
    this.happiness = 70 + Math.random() * 30;
    this.emote = null; this.emoteT = 0; this.emoteCd = 2 + Math.random() * 4;
    this.stepT = 0; this.idleT = 1 + Math.random() * 2;
  }
  get moving(){ return !!this.target; }
  update(dt){
    this.happiness = Math.max(0, this.happiness - dt * 0.6);

    if (this.emote){
      this.emoteT += dt;
      if (this.emoteT > 1.8){ this.emote = null; this.emoteT = 0; }
    } else {
      this.emoteCd -= dt;
      if (this.emoteCd <= 0){
        const pool = this.happiness > 65 ? ['heart','note','sparkle','bang']
                   : this.happiness > 30 ? ['note','sparkle','sweat']
                   : ['zzz','sweat'];
        this.emote = pool[Math.floor(Math.random() * pool.length)];
        this.emoteT = 0;
        this.emoteCd = 3 + Math.random() * 5;
      }
    }

    if (this.target){
      const dx = this.target.x - this.x, dy = this.target.y - this.y;
      const dist = Math.hypot(dx, dy);
      const speed = 9 + this.happiness / 22;
      if (dist < 1.5){
        this.target = null;
        this.idleT = 1 + Math.random() * 3;
      } else {
        this.x += (dx / dist) * speed * dt;
        this.y += (dy / dist) * speed * dt * 0.6;
        if (Math.abs(dx) > 0.5) this.dir = dx > 0 ? 1 : -1;
        this.stepT += dt;
      }
    } else {
      this.idleT -= dt;
      if (this.idleT <= 0){
        this.target = { x: 16 + Math.random() * (W - 32), y: 50 + Math.random() * (H - 68) };
        this.stepT = 0;
      }
    }
  }
  draw(g){
    const bob = this.moving ? (Math.floor(this.stepT * 7) % 2) : (Math.floor(performance.now() / 700) % 2);

    const box = (this.img.box) || { x: 0, y: 0, w: this.img.width, h: this.img.height };
    // draw the pokemon smaller than its native sprite, cropped to its visible pixels
    const s = 0.65;
    const w = Math.round(box.w * s), h = Math.round(box.h * s);

    // shadow on the ground, sized to the feet
    const sw = Math.max(6, Math.round(w * 0.55));
    g.fillStyle = 'rgba(20,50,25,0.28)';
    g.fillRect(Math.round(this.x - sw / 2), Math.round(this.y - 1), sw, 2);
    g.fillRect(Math.round(this.x - sw / 2 - 2), Math.round(this.y), sw + 4, 1);

    // feet sit exactly on this.y
    const dy = Math.round(this.y - h - bob);
    if (this.img.complete && this.img.width){
      if (this.dir === -1){
        g.save();
        g.translate(Math.round(this.x), 0);
        g.scale(-1, 1);
        g.drawImage(this.img, box.x, box.y, box.w, box.h, Math.round(-w / 2), dy, w, h);
        g.restore();
      } else {
        g.drawImage(this.img, box.x, box.y, box.w, box.h, Math.round(this.x - w / 2), dy, w, h);
      }
    }

    if (this.emote){
      const t = this.emoteT;
      const rise = Math.min(10, t * 9);
      const alpha = t < 1.2 ? 1 : Math.max(0, 1 - (t - 1.2) / 0.6);
      drawEmote(g, this.emote, Math.round(this.x), Math.round(this.y - h - 6 - rise), alpha);
    }
  }
  hitTest(x, y){
    const box = (this.img.box) || { w: this.img.width, h: this.img.height };
    const h = Math.round(box.h * 0.65) || 20;
    const halfW = Math.max(6, Math.round(box.w * 0.65 / 2));
    return x > this.x - halfW && x < this.x + halfW && y > this.y - h && y < this.y + 2;
  }
  pet(){
    this.happiness = Math.min(100, this.happiness + 14);
    this.emote = 'heart';
    this.emoteT = 0;
  }
}

function drawEmote(g, icon, cx, cy, alpha){
  const { rows, pal } = ICONS[icon];
  const w = rows[0].length, h = rows.length;
  const bw = w + 6, bh = h + 6;
  const bx = Math.round(cx - bw / 2), by = Math.round(cy - bh);

  g.globalAlpha = alpha;

  g.fillStyle = '#f7fff2';
  g.fillRect(bx + 1, by, bw - 2, bh);
  g.fillRect(bx, by + 1, bw, bh - 2);

  g.fillStyle = '#2c4a2e';
  g.fillRect(bx + 1, by, bw - 2, 1);
  g.fillRect(bx + 1, by + bh - 1, bw - 2, 1);
  g.fillRect(bx, by + 1, 1, bh - 2);
  g.fillRect(bx + bw - 1, by + 1, 1, bh - 2);

  g.fillStyle = '#f7fff2';
  g.fillRect(cx - 1, by + bh, 2, 2);
  g.fillRect(cx, by + bh + 2, 1, 1);

  for (let y = 0; y < h; y++){
    for (let x = 0; x < w; x++){
      const col = pal[rows[y][x]];
      if (!col) continue;
      g.fillStyle = col;
      g.fillRect(bx + 3 + x, by + 3 + y, 1, 1);
    }
  }
  g.globalAlpha = 1;
}

const pals = [
  new Pal(ROSTER[0], 70, 120),
  new Pal(ROSTER[1], 190, 90),
  new Pal(ROSTER[2], 140, 150),
  new Pal(ROSTER[3], 250, 130),
  new Pal(ROSTER[4], 40, 70)
];

document.getElementById('n').textContent = pals.length;

/* ---------- input ---------- */

function toLogical(e){
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale };
}

canvas.addEventListener('click', e => {
  const p = toLogical(e);
  for (const pal of pals){
    if (pal.hitTest(p.x, p.y)){ pal.pet(); return; }
  }
});

canvas.addEventListener('mousemove', e => {
  const p = toLogical(e);
  canvas.style.cursor = pals.some(pal => pal.hitTest(p.x, p.y)) ? 'pointer' : 'default';
});

/* ---------- loop ---------- */

const moodEl = document.getElementById('mood');
let last = performance.now(), moodClock = 0;

function frame(t){
  const dt = Math.min(0.05, (t - last) / 1000);
  last = t;

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(ground, 0, 0);

  for (const p of pals) p.update(dt);
  pals.slice().sort((a, b) => a.y - b.y).forEach(p => p.draw(ctx));

  moodClock += dt;
  if (moodClock > 0.25){
    moodClock = 0;
    const avg = pals.reduce((s, p) => s + p.happiness, 0) / pals.length;
    moodEl.textContent = avg > 70 ? 'blissful' : avg > 45 ? 'content' : avg > 20 ? 'meh' : 'grumpy';
    moodEl.style.color = avg > 70 ? '#a9e08a' : avg > 45 ? '#d7e8d2' : '#ff9f7a';
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
